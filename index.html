                "@type": "Question",
                "name": "What does an internet speed test measure?",
                "acceptedAnswer": { "@type": "Answer", "text": "An internet speed test estimates how quickly data moves between your device and a test endpoint. Download measures data received, upload measures data sent, and response-time checks show how quickly that endpoint responds." }
              },
              {
                "@type": "Question",
                "name": "Why is my internet slow when the speed test looks good?",
                "acceptedAnswer": { "@type": "Answer", "text": "A good result to one test endpoint does not guarantee that every app or website will feel fast. Wi-Fi interference, device limits, busy networks, upload activity and the route to a particular service can all affect the experience." }
              },
              {
                "@type": "Question",
                "name": "What is the difference between download and upload speed?",
                "acceptedAnswer": { "@type": "Answer", "text": "Download speed describes how quickly your device receives data. Upload speed describes how quickly it sends data." }
              },

                "@type": "Question",
                "name": "Is TEZZ CONNECT latency the same as a traditional ping test?",
                "acceptedAnswer": { "@type": "Answer", "text": "No. TEZZ CONNECT measures browser HTTP request-and-response time to its own network edge. It does not send ICMP ping packets and does not measure the complete route to your ISP, a game server or every website." }

    <script>
      // Opt-in, local-only Google CMP diagnostics. Activated only with ?tezz-cmp-debug=1.
      // No consent values or identifiers are transmitted or persisted.
      (function () {
        if (new URLSearchParams(window.location.search).get('tezz-cmp-debug') !== '1') return;
        var state = {
          page: window.location.href,
          country: 'checking',
          googlefc: typeof window.googlefc,
          consentApiReady: false,
          showRevocationMessage: 'not available',
          tcfApi: 'not available',
          tcfCallback: 'not called',
          cmpStatus: 'unknown',
          eventStatus: 'unknown',
          gdprApplies: 'unknown',
          tcStringPresent: false,
          purpose1Consent: 'unknown',
          adsScript: 'not checked',
          googleResources: []
        };
        var panel;
        var tcfListenerRegistered = false;
        function render() {
          if (!panel || !panel.isConnected) return;
          var pre = panel.querySelector('pre');
          if (pre) pre.textContent = JSON.stringify(state, null, 2);
        }
        function update(key, value) { state[key] = value; render(); }
        function startTcfCheck() {
          if (typeof window.__tcfapi !== 'function') {
            update('tcfApi', typeof window.__tcfapi);
            return;
          }
          update('tcfApi', 'function');
          if (tcfListenerRegistered) return;
          tcfListenerRegistered = true;
          try {
            window.__tcfapi('addEventListener', 2.2, function (tcData, success) {
              update('tcfCallback', success ? 'success' : 'failed');
              if (!success || !tcData) return;
              update('cmpStatus', tcData.cmpStatus || 'unknown');
              update('eventStatus', tcData.eventStatus || 'unknown');
              update('gdprApplies', typeof tcData.gdprApplies === 'boolean' ? tcData.gdprApplies : 'unknown');
              update('tcStringPresent', typeof tcData.tcString === 'string' && tcData.tcString.length > 0);
              update('purpose1Consent', tcData.purpose && tcData.purpose.consents
                ? !!tcData.purpose.consents[1] : 'unknown');
            });
          } catch (error) {
            update('tcfCallback', 'exception: ' + String(error));
          }
        }
        function setupPanel() {
          panel = document.createElement('section');
          panel.id = 'tezz-cmp-diagnostic';
          panel.style.cssText = 'position:fixed;z-index:2147483647;inset:8px;background:#fff;color:#111;padding:14px;overflow:auto;font:12px/1.45 monospace;border:3px solid #1769aa;border-radius:12px;box-shadow:0 4px 30px #0008';
          var heading = document.createElement('strong');
          heading.textContent = 'TEZZ CONNECT — Google CMP diagnostic (local only)';
          var note = document.createElement('p');
          note.textContent = 'This panel is activated only by the diagnostic URL. It does not change consent or send diagnostic data.';
          var pre = document.createElement('pre');
          pre.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere';
          var close = document.createElement('button');
          close.type = 'button'; close.textContent = 'Close diagnostic';
          close.onclick = function () { panel.remove(); };
          panel.append(heading, note, pre, close);
          document.body.appendChild(panel);
          render();
        }
        function inspectResources() {
          try {
            state.googleResources = performance.getEntriesByType('resource')
              .map(function (entry) { return entry.name; })
              .filter(function (name) { return /fundingchoices|googlefc|googlesyndication|pagead/i.test(name); })
              .map(function (name) { return name.split('?')[0]; });
          } catch (_) {}
          render();
        }
        window.googlefc = window.googlefc || {};
        window.googlefc.callbackQueue = window.googlefc.callbackQueue || [];
        window.googlefc.callbackQueue.push({
          'CONSENT_API_READY': function () {
            update('consentApiReady', true);
            update('showRevocationMessage',
              typeof window.googlefc.showRevocationMessage === 'function' ? 'function' : typeof window.googlefc.showRevocationMessage);
            startTcfCheck();
          }
        });
        fetch('/locale-country', { cache: 'no-store', credentials: 'same-origin' })
          .then(function (response) { return response.json(); })
          .then(function (data) { update('country', data.country || 'missing'); })
          .catch(function () { update('country', 'lookup failed'); });
        document.addEventListener('DOMContentLoaded', function () {
          setupPanel();
          var ads = document.getElementById('tezz-ads');
          if (ads) {
            update('adsScript', 'tag present; loading');
            ads.addEventListener('load', function () { update('adsScript', 'loaded'); inspectResources(); });
            ads.addEventListener('error', function () { update('adsScript', 'load error'); inspectResources(); });
          } else update('adsScript', 'tag missing');
          inspectResources();
          var attempts = 0;
          var poll = window.setInterval(function () {
            attempts += 1;
            if (typeof window.__tcfapi === 'function') startTcfCheck();
            update('googlefc', typeof window.googlefc);
            update('showRevocationMessage',
              typeof window.googlefc.showRevocationMessage === 'function' ? 'function' : typeof window.googlefc.showRevocationMessage);
            inspectResources();
            if (attempts >= 20) window.clearInterval(poll);
          }, 500);
        });
      })();
    </script>
