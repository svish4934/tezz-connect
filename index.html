            analytics_storage: prefs.analytics ? 'granted' : 'denied',

          }
        }
        function save(prefs) {
          prefs = { necessary: true, analytics: !!prefs.analytics, ads: !!prefs.ads, updatedAt: new Date().toISOString() };
          try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (_) {}
          current = prefs; loadScripts(prefs); render(false);
        }
        function render(show) {
          var old = document.getElementById('tezz-cookie-panel');
          if (old) old.remove();
          if (!show) return;
          var panel = document.createElement('section');
          panel.id = 'tezz-cookie-panel';
          panel.setAttribute('aria-label', 'Cookie preferences');
          panel.innerHTML = '<div class="tezz-cookie-card"><span class="tezz-cookie-icon" aria-hidden="true">◉</span><div class="tezz-cookie-copy"><strong>Cookies</strong><span> Essential cookies keep TEZZ CONNECT working. Optional analytics and ads need your permission.</span> <a href="/cookie-policy/">Learn more</a></div><div class="tezz-cookie-actions"><button type="button" data-action="manage">Manage</button><button type="button" data-action="reject">Reject optional</button><button type="button" data-action="accept">Accept all</button></div></div>';
          document.body.appendChild(panel);
          panel.querySelector('[data-action="reject"]').onclick = function(){ save({analytics:false,ads:false}); };
          panel.querySelector('[data-action="accept"]').onclick = function(){ save({analytics:true,ads:true}); };
          panel.querySelector('[data-action="manage"]').onclick = function(){
            var oldPrefs = current || {analytics:false,ads:false};

            panel.querySelector('.tezz-cookie-card').appendChild(settings);
            settings.querySelector('#tezz-analytics-choice').checked = !!oldPrefs.analytics;
            settings.querySelector('#tezz-ads-choice').checked = !!oldPrefs.ads;
            settings.querySelector('[data-save]').onclick = function(){ save({analytics:settings.querySelector('#tezz-analytics-choice').checked,ads:settings.querySelector('#tezz-ads-choice').checked}); };
            settings.querySelector('[data-cancel]').onclick = function(){ settings.remove(); };
          };
        }
        var style = document.createElement('style');
        style.textContent = '#tezz-cookie-panel{position:fixed;z-index:99999;left:10px;right:10px;bottom:8px;font:12px/1.4 system-ui,sans-serif;color:#f4f7ff}#tezz-cookie-panel .tezz-cookie-card{max-width:1200px;margin:auto;background:rgba(10,25,48,.96);backdrop-filter:blur(12px);border:1px solid #47617f;border-radius:18px;box-shadow:0 8px 28px #0005;padding:9px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}#tezz-cookie-panel .tezz-cookie-icon{font-size:22px;color:#dceaff;flex:0 0 auto}#tezz-cookie-panel .tezz-cookie-copy{flex:1;min-width:0}#tezz-cookie-panel .tezz-cookie-copy strong{font-size:13px;margin-right:5px}#tezz-cookie-panel .tezz-cookie-copy a{color:#b9d7ff;white-space:nowrap;margin-left:5px}#tezz-cookie-panel button{border:1px solid #829bbd;background:transparent;color:#f4f7ff;border-radius:12px;padding:7px 12px;font:600 12px system-ui,sans-serif;white-space:nowrap;cursor:pointer}#tezz-cookie-panel button[data-action=accept],#tezz-cookie-panel [data-save]{background:#0865e8;color:#fff;border-color:#0865e8}.tezz-cookie-actions{display:flex;gap:7px;flex:0 0 auto}.tezz-cookie-settings{border-top:1px solid #47617f;margin-top:9px;padding-top:9px;flex-basis:100%;color:#f4f7ff}.tezz-cookie-settings label{display:inline-block;margin:5px 14px 5px 0}.tezz-cookie-settings small{color:#c5d3e6;margin-left:5px}.tezz-cookie-settings button{margin:6px 7px 0 0}#tezz-cookie-panel .tezz-cookie-card:has(.tezz-cookie-settings){flex-wrap:wrap}@media(max-width:650px){#tezz-cookie-panel{left:6px;right:6px;bottom:6px}#tezz-cookie-panel .tezz-cookie-card{padding:8px 10px;gap:7px;border-radius:13px;flex-wrap:wrap}#tezz-cookie-panel .tezz-cookie-icon{font-size:18px}#tezz-cookie-panel .tezz-cookie-copy{font-size:11px;flex:1 1 calc(100% - 32px)}#tezz-cookie-panel .tezz-cookie-copy strong{font-size:12px}#tezz-cookie-panel .tezz-cookie-actions{width:100%;gap:5px}#tezz-cookie-panel button{padding:7px 8px;font-size:11px;flex:1}.tezz-cookie-settings{font-size:12px}}';
