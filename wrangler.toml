name = "tezz-connect"
main = "worker/index.ts"
compatibility_date = "2026-11-04"

[[d1_databases]]
binding = "BENCHMARKS_DB"
database_name = "tezz-connect-benchmarks"
database_id = "4ba570ab-345a-4645-b987-7da0115201ac"
migrations_dir = "./migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/robots.txt", "/sitemap.xml", "/api/*", "/about", "/about/", "/internet-doctor", "/internet-doctor/", "/tools", "/tools/", "/global-network", "/global-network/"]
not_found_handling = "single-page-application"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "TRANSFER_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "BENCHMARK_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# Isolated resources for Cloudflare Worker Previews.
# These must never point at production D1 or rate-limit namespaces.
[previews]
[[previews.d1_databases]]
binding = "BENCHMARKS_DB"
database_name = "tezz-connect-preview"
database_id = "e084a157-2fac-4aa7-9f63-a3ac1db80c18"
migrations_dir = "./migrations"

[[previews.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 600, period = 60 }

[[previews.ratelimits]]
name = "TRANSFER_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 300, period = 60 }

[[previews.ratelimits]]
name = "BENCHMARK_RATE_LIMITER"
namespace_id = "2003"
simple = { limit = 30, period = 60 }
