name = "tezz-connect"
main = "worker/index.ts"
compatibility_date = "2026-11-04"

[[d1_databases]]
binding = "BENCHMARKS_DB"
database_name = "tezz-connect-benchmarks"
database_id = "4ba570ab-345a-4645-b987-7da0115201ac"
migrations_dir = "./migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/robots.txt", "/sitemap.xml", "/api/*"]
not_found_handling = "single-page-application"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "TRANSFER_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "BENCHMARK_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 6, period = 60 }
