name: Build TEZZ CONNECT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run benchmark handler integration tests
        run: npm run test:benchmarks
      - name: Run benchmark D1 SQL integration tests
        run: npm run test:benchmarks:d1
      - name: Run Wrangler local D1 integration tests
        run: npm run test:benchmarks:wrangler
      - name: Build application
        run: npm run build
