name: Build TEZZ CONNECT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run benchmark handler integration tests
        run: npm run test:benchmarks
      - name: Run benchmark D1 SQL integration tests
        run: npm run test:benchmarks:d1
      - name: Run Wrangler local D1 integration tests
        run: npm run test:benchmarks:wrangler
      - name: Apply isolated preview D1 migrations
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 92 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN; preview migration not run"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID; preview migration not run"; exit 1; }
          npx wrangler d1 migrations apply tezz-connect-preview --remote --config wrangler.preview-migrations.toml
      - name: Build application
        run: npm run build
