name: Build TEZZ CONNECT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Run benchmark handler integration tests
        run: npm run test:benchmarks
      - name: Run benchmark D1 SQL integration tests
        run: npm run test:benchmarks:d1
      - name: Run Wrangler local D1 integration tests
        run: npm run test:benchmarks:wrangler
      - name: Apply isolated preview D1 migrations
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 92 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN; preview migration not run"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID; preview migration not run"; exit 1; }
          npx wrangler d1 migrations apply tezz-connect-preview --remote --config wrangler.preview-migrations.toml
      - name: Validate Knowledge Hub locales
        run: npm run test:locales
      - name: Validate sitemap and Knowledge Hub SEO
        run: npm run test:seo-guides
      - name: Validate English homepage SEO and content parity
        run: npm run test:seo-homepage
      - name: Validate consent implementation
        run: npm run test:consent
      - name: Build application
        run: npm run build
      - name: Verify live localized crawler preview
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 219 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_URL: https://seo-localized-crawlable-html-fallbacks-tezz-connect.svish4934.workers.dev
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 60); do
            CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 -A 'Googlebot' "$PREVIEW_URL/hi/" || true)"
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            echo "Cloudflare preview not ready (HTTP $CODE), attempt $attempt/60"
            sleep 5
          done
          test "$READY" -eq 1 || { echo "Cloudflare preview did not become available"; exit 1; }
          locales=(hi mr bn zh-CN pt-BR es fr ar)
          routes=("" "about" "internet-doctor" "tools" "global-network")
          for locale in "${locales[@]}"; do
            for route in "${routes[@]}"; do
              if [ -z "$route" ]; then path="$locale/"; canonical="https://tezzconnect.online/$locale/"
              else path="$locale/$route"; canonical="https://tezzconnect.online/$locale/$route"; fi
              file="$(mktemp)"
              curl --fail --silent --show-error --max-time 30 -A 'Googlebot' "$PREVIEW_URL/$path" -o "$file"
              grep -Fqi "<html lang=\"$locale\"" "$file" || { echo "Missing lang=$locale on /$path"; exit 1; }
              grep -Fqi "href=\"$canonical\"" "$file" || { echo "Incorrect canonical on /$path"; exit 1; }
              grep -Fqi "hreflang=\"$locale\"" "$file" || { echo "Missing self hreflang on /$path"; exit 1; }
              grep -Fqi 'hreflang="x-default"' "$file" || { echo "Missing x-default on /$path"; exit 1; }
              grep -Fq 'id="seo-fallback"' "$file" || { echo "Crawler fallback missing on /$path"; exit 1; }
              H1_COUNT="$(grep -Eoi '<h1([[:space:]>])' "$file" | wc -l | tr -d ' ')"
              test "$H1_COUNT" = "1" || { echo "Expected one H1 on /$path; found $H1_COUNT"; exit 1; }
              grep -Eqi '<title>[^<]+</title>' "$file" || { echo "Missing title on /$path"; exit 1; }
              grep -Eqi '<meta name="description" content="[^"]+"' "$file" || { echo "Missing description on /$path"; exit 1; }
              grep -Fq '"@type":"WebPage"' "$file" || { echo "Localized WebPage schema missing on /$path"; exit 1; }
              grep -Fq '"inLanguage":"'$locale'"' "$file" || { echo "Incorrect WebPage schema language on /$path"; exit 1; }
              grep -Fq '"url":"'$canonical'"' "$file" || { echo "Incorrect WebPage schema URL on /$path"; exit 1; }
              if grep -Eqi '<meta[^>]+name="robots"[^>]+content="noindex' "$file"; then echo "Unexpected noindex on /$path"; exit 1; fi
              if [ "$locale" = "ar" ]; then grep -Fqi '<html lang="ar" dir="rtl"' "$file" || { echo "Arabic response is not RTL"; exit 1; }; fi
              grep -Fqi "href=\"/$locale/about\"" "$file" || { echo "Localized About navigation missing on /$path"; exit 1; }
              rm -f "$file"
              echo "PASS crawler /$path"
            done
          done
          curl --fail --silent --show-error --max-time 30 -A 'Mozilla/5.0' "$PREVIEW_URL/ar/about" -o browser.html
          grep -Fq 'id="root"' browser.html
          if grep -Fq 'id="seo-fallback"' browser.html; then echo "Crawler fallback leaked into browser response"; exit 1; fi
          HEADERS="$(curl --silent --show-error --head --max-time 30 -A 'Googlebot' "$PREVIEW_URL/hi/" | tr '[:upper:]' '[:lower:]')"
          echo "$HEADERS" | grep -q '^http/.* 200'
          echo "$HEADERS" | grep -q '^cache-control:.*no-store'
          echo "Live localized crawler verification passed."
