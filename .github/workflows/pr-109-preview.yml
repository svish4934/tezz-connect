name: PR 109 isolated Worker preview

on:
  push:
    branches: [seo/pr-109-rebased-20261113]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview-smoke:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/seo/pr-109-rebased-20261113') || (github.event_name == 'pull_request' && (github.event.pull_request.number == 113 || github.event.pull_request.number == 114 || github.event.pull_request.number == 133) && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Build preview assets
        run: npm run build
      - name: Start isolated local Worker for smoke tests
        id: preview
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > worker-preview.log 2>&1 &
          echo $! > worker-preview.pid
          PREVIEW_URL="http://127.0.0.1:8787"
          READY=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail "$PREVIEW_URL/" >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            cat worker-preview.log
            echo "Local Worker did not become ready"
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
      - name: Verify crawler HTML, metadata and utility noindex
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          for route in global-network internet-doctor tools; do
            curl --fail --silent --show-error -A "OpenSEO" "$PREVIEW_URL/$route" -o "$route.html"
            H1_COUNT="$(grep -Eo '<h1([[:space:]>])' "$route.html" | wc -l)"
            test "$H1_COUNT" -eq 1 || { echo "Expected exactly one H1 on /$route; found $H1_COUNT"; exit 1; }
            grep -q 'id="seo-fallback"' "$route.html" || { echo "Crawler fallback missing on /$route"; exit 1; }
            grep -qi '<title>[^<][^<]*</title>' "$route.html" || { echo "Missing title on /$route"; exit 1; }
            grep -qi '<meta name="description" content="[^"]\+"' "$route.html" || { echo "Missing meta description on /$route"; exit 1; }
            grep -qi '<link rel="canonical" href="https://tezzconnect.online/' "$route.html" || { echo "Missing production canonical on /$route"; exit 1; }
            if grep -Eqi '<meta[^>]+name="robots"[^>]+content="noindex' "$route.html"; then
              echo "Public route /$route unexpectedly contains meta noindex"
              exit 1
            fi
          done
          for route in history report; do
            curl --fail --silent --show-error -A "OpenSEO" "$PREVIEW_URL/$route" -o "$route.html"
            grep -Eqi '<meta[^>]+name="robots"[^>]+content="noindex,follow"' "$route.html" || {
              echo "Missing noindex,follow on /$route"; exit 1;
            }
            grep -qi 'cache-control:.*no-store' <(curl -sSI -A "OpenSEO" "$PREVIEW_URL/$route" | tr '[:upper:]' '[:lower:]') || {
              echo "Missing Cache-Control: no-store on /$route"; exit 1;
            }
          done
      - name: Verify normal browser receives SPA shell
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -A "Mozilla/5.0" "$PREVIEW_URL/global-network" -o browser.html
          grep -q 'id="root"' browser.html
          if grep -q 'id="seo-fallback"' browser.html; then
            echo "SEO fallback leaked into normal browser response"
            exit 1
          fi
