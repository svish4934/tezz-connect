<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Steady response time versus variable delay</title><desc id="d">Two timelines compare evenly spaced responses with uneven response intervals that illustrate delay variation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#123d55"/></linearGradient></defs><rect width="1000" height="470" rx="28" fill="#eaf2f8"/><rect x="12" y="12" width="976" height="446" rx="22" fill="url(#bg)"/><text x="48" y="58" fill="#70e8de" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">TEZZ CONNECT · VISUAL EXPLAINER</text><text x="48" y="105" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="26" font-weight="700">Steady response time versus variable delay</text><rect x='48' y='140' width='430' height='245' rx='20' fill='#123c50' stroke='#4ce0ca'/><rect x='522' y='140' width='430' height='245' rx='20' fill='#252e55' stroke='#a49bff'/><g font-family='Arial,sans-serif'><text x='78' y='184' fill='#72f0d9' font-size='18' font-weight='700'>STEADY RESPONSE</text><text x='552' y='184' fill='#c4b5ff' font-size='18' font-weight='700'>VARIABLE RESPONSE</text><path d='M88 280H438M562 280H912' stroke='#8baec3' stroke-width='2'/><g fill='#54e6cf'><circle cx='112' cy='280' r='9'/><circle cx='192' cy='280' r='9'/><circle cx='272' cy='280' r='9'/><circle cx='352' cy='280' r='9'/><circle cx='432' cy='280' r='9'/></g><g fill='#b3a4ff'><circle cx='582' cy='280' r='9'/><circle cx='625' cy='280' r='9'/><circle cx='755' cy='280' r='9'/><circle cx='790' cy='280' r='9'/><circle cx='902' cy='280' r='9'/></g><text x='88' y='333' fill='#d5eaf3' font-size='15'>Even intervals</text><text x='562' y='333' fill='#d5eaf3' font-size='15'>Uneven intervals (jitter)</text><text x='88' y='358' fill='#8fded4' font-size='13'>More consistent timing</text><text x='562' y='358' fill='#c4b5ff' font-size='13'>Greater variation in delay</text></g><text x="48" y="430" fill="#8eafc4" font-family="Arial,sans-serif" font-size="12">Illustrative learning graphic · Real-world performance varies by device, network and route</text></svg>