<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Different ways to measure network response</title><desc id="d">Two separate lanes compare an ICMP echo request and reply with a browser HTTP request and response.</desc><rect width="1000" height="430" rx="26" fill="#071629"/><text x="42" y="52" fill="#70e8de" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">MEASUREMENT PATHS</text><text x="42" y="91" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Same idea, different protocol and destination</text><g font-family="Arial,sans-serif"><rect x="38" y="125" width="924" height="122" rx="18" fill="#12364a" stroke="#4bdcc9"/><text x="62" y="158" fill="#70e8de" font-size="17" font-weight="700">ICMP PING UTILITY</text><rect x="65" y="178" width="170" height="48" rx="10" fill="#1b5360"/><text x="150" y="208" text-anchor="middle" fill="#fff" font-size="17">Your device</text><path d="M250 191H730" stroke="#58e5d0" stroke-width="5"/><path d="m715 179 18 12-18 12" fill="none" stroke="#58e5d0" stroke-width="5"/><path d="M730 213H250" stroke="#9bcfff" stroke-width="3" stroke-dasharray="9 8"/><path d="m265 203-18 10 18 10" fill="none" stroke="#9bcfff" stroke-width="3"/><rect x="745" y="178" width="170" height="48" rx="10" fill="#293e69"/><text x="830" y="208" text-anchor="middle" fill="#fff" font-size="17">Ping target</text><text x="500" y="239" text-anchor="middle" fill="#a9c6d9" font-size="12">Echo request and reply</text><rect x="38" y="270" width="924" height="122" rx="18" fill="#102d48" stroke="#6ab9ff"/><text x="62" y="303" fill="#9bd0ff" font-size="17" font-weight="700">BROWSER HTTP TIMING</text><rect x="65" y="323" width="170" height="48" rx="10" fill="#1b5360"/><text x="150" y="353" text-anchor="middle" fill="#fff" font-size="17">Your browser</text><path d="M250 336H730" stroke="#6ab9ff" stroke-width="5"/><path d="m715 324 18 12-18 12" fill="none" strok