<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Wi-Fi band range and throughput trade-offs</title><desc id="d">Three conceptual cards compare 2.4, 5 and 6 gigahertz Wi-Fi bands by typical reach and capacity characteristics.</desc><rect width="1000" height="420" rx="26" fill="#071629"/><text x="42" y="54" fill="#70e8de" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">WI-FI BAND CHOICES</text><text x="42" y="94" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Choose for the room and the device</text><g font-family="Arial,sans-serif"><rect x="40" y="130" width="290" height="235" rx="18" fill="#12394a" stroke="#52e5ce" stroke-width="2"/><text x="68" y="176" fill="#70e8de" font-size="27" font-weight="700">2.4 GHz</text><text x="68" y="218" fill="#fff" font-size="19" font-weight="700">Often broader reach</text><text x="68" y="250" fill="#c0d5e4" font-size="16">Can travel farther through</text><text x="68" y="275" fill="#c0d5e4" font-size="16">obstacles; often more crowded</text><rect x="68" y="308" width="220" height="12" rx="6" fill="#254f60"/><rect x="68" y="308" width="180" height="12" rx="6" fill="#52e5ce"/><rect x="355" y="130" width="290" height="235" rx="18" fill="#15334d" stroke="#6ab9ff" stroke-width="2"/><text x="383" y="176" fill="#9bd0ff" font-size="27" font-weight="700">5 GHz</text><text x="383" y="218" fill="#fff" font-size="19" font-weight="700">Often higher capacity</text><text x="383" y="250" fill="#c0d5e4" font-size="16">Can deliver higher throughput</text><text x="383" y="275" fill="#c0d5e4" font-size="16">at shorter range</text><rect x="383" y="308" width="220" height="12" rx="6" fill="#254f60"/><rect x="383" y="308" width="180" height="12" rx="6" fill="#6ab9ff"/><rect x="670" y="130" width="290" height="235" rx="18" fill="#242d55" stroke="#a49bff" stroke-width="2"/><text x="698" y="176" fill="#c6c0ff" font-size="27" font-weight="700">6 GHz</text><text x="698" y="218" fill="#fff" font-size="19" font-weight="700">More spectrum options</text><text x="698" y="250" fill="#c0d5e4" font-size="16">Needs compatible router and</text><text x="698" y="275" fill="#c0d5e4" font-size="16">client; coverage can be shorter</text><rect x="698" y="308" width="220" height="12" rx="6" fill="#254f60"/><rect x="698" y="308" width="165" height="12" rx="6" fill="#a49bff"/><text x="500" y="399" text-anchor="middle" fill="#a9c6d9" font-size="14">Bars are conceptual, not measured speed or coverage ratings</text></g></svg>