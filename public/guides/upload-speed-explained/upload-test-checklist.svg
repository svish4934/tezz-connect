<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">A fair upload speed test sequence</title><desc id="d">Five numbered steps show how to prepare, run and compare upload speed tests.</desc><rect width="1000" height="340" rx="26" fill="#071629"/><text x="42" y="54" fill="#70e8de" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">TEST WITH CONSISTENT CONDITIONS</text><text x="42" y="94" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Make each comparison fair</text><g font-family="Arial,sans-serif"><path d="M130 192H870" stroke="#3d7187" stroke-width="5"/><g><circle cx="130" cy="192" r="38" fill="#16485a" stroke="#52e5ce" stroke-width="3"/><text x="130" y="201" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">1</text><text x="130" y="253" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">Pause</text><text x="130" y="278" fill="#b9cedc" text-anchor="middle" font-size="13">background uploads</text></g><g><circle cx="315" cy="192" r="38" fill="#16485a" stroke="#52e5ce" stroke-width="3"/><text x="315" y="201" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">2</text><text x="315" y="253" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">Use one</text><text x="315" y="278" fill="#b9cedc" text-anchor="middle" font-size="13">device and service</text></g><g><circle cx="500" cy="192" r="38" fill="#16485a" stroke="#52e5ce" stroke-width="3"/><text x="500" y="201" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">3</text><text x="500" y="253" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">Compare</text><text x="500" y="278" fill="#b9cedc" text-anchor="middle" font-size="13">Wi-Fi and Ethernet</text></g><g><circle cx="685" cy="192" r="38" fill="#16485a" stroke="#52e5ce" stroke-width="3"/><text x="685" y="201" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">4</text><text x="685" y="253" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">Repeat</text><text x="685" y="278" fill="#b9cedc" text-anchor="middle" font-size="13">at different times</text></g><g><circle cx="870" cy="192" r="38" fill="#16485a" stroke="#52e5ce" stroke-width="3"/><text x="870" y="201" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">5</text><text x="870" y="253" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">Compare</text><text x="870" y="278" fill="#b9cedc" text-anchor="middle" font-size="13">with plan details</text></g></g></svg>