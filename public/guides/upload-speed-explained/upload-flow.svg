" y="333" text-anchor="middle" fill="#fff" font-size="16">Cloud service</text><text x="500" y="390" text-anchor="middle" fill="#a9d7e9" font-size="14">File data travels upstream; the receiving service may impose its own limits</text></g><text x="48" y="430" fill="#8eafc4" font-family="Arial,sans-serif" font-size="12">Illustrative learning graphic · Real-world performance varies by device, network and route</text></svg>