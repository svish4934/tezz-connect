<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">A website request travels across the internet</title>
<desc id="desc">A glowing data path connects a phone and home Wi-Fi router through an internet provider and interconnected networks to a website server. A second path shows the website data returning to the device. Decorative network nodes illustrate that routes can vary.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset=".55" stop-color="#102e4b"/><stop offset="1" stop-color="#123d55"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#47f0d0"/><stop offset=".55" stop-color="#54c9ff"/><stop offset="1" stop-color="#9b9bff"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183c59"/><stop offset="1" stop-color="#10283f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#48dff0" stop-opacity=".24"/><stop offset="1" stop-color="#48dff0" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="620" rx="34" fill="#eaf2f8"/>
<rect x="14" y="14" width="1172" height="592" rx="27" fill="url(#back)"/>
<circle cx="600" cy="300" r="360" fill="url(#glow)"/>
<g fill="#8cb7d1" opacity=".24"><circle cx="78" cy="130" r="2"/><circle cx="190" cy="80" r="2"/><circle cx="1040" cy="110" r="2"/><circle cx="1110" cy="470" r="2"/><circle cx="860" cy="540" r="2"/><circle cx="300" cy="520" r="2"/><circle cx="720" cy="78" r="2"/></g>
<text x="64" y="78" fill="#6fe8e0" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">INSIDE THE INTERNET</text>
<text x="64" y="119" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Your click. A global journey. A page delivered.</text>
<text x="64" y="151" fill="#a9c6d9" font-family="Arial,sans-serif" font-size="16">A simplified view of what happens when you open a website</text>
<path d="M180 330 C280 205 360 205 455 330 S640 455 750 330 S930 205 1030 330" fill="none" stroke="#4edbdc" stroke-width="18" opacity=".12" filter="url(#shadow)"/>
<path d="M180 330 C280 205 360 205 455 330 S640 455 750 330 S930 205 1030 330" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 13"/>
<path d="M1030 388 C930 510 840 510 750 388 S560 266 455 388 S275 510 180 388" fill="none" stroke="#8caeff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 12" opacity=".8"/>
<g fill="#8ff8e6"><circle cx="180" cy="330" r="7"/><circle cx="455" cy="330" r="7"/><circle cx="750" cy="330" r="7"/><circle cx="1030" cy="330" r="7"/></g>
<g>
 <rect x="92" y="220" width="176" height="220" rx="22" fill="url(#card)" stroke="#4bd8d6" stroke-opacity=".7"/>
 <rect x="151" y="249" width="58" height="104" rx="12" fill="none" stroke="#a9f5ed" stroke-width="5"/>
 <path d="M164 263h32M164 336h32" stroke="#a9f5ed" stroke-width="3" stroke-linecap="round"/><circle cx="180" cy="344" r="3" fill="#a9f5ed"/>
 <text x="180" y="391" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Your device</text>
 <text x="180" y="416" text-anchor="middle" fill="#a9c6d9" font-family="Arial,sans-serif" font-size="13">Phone or laptop</text>
</g>
<g>
 <rect x="367" y="220" width="176" height="220" rx="22" fill="url(#card)" stroke="#4bd8d6" stroke-opacity=".7"/>
 <rect x="414" y="288" width="82" height="43" rx="9" fill="none" stroke="#a9f5ed" stroke-width="4"/>
 <path d="M428 280 Q455 249 482 280 M438 289 Q455 271 472 289" fill="none" stroke="#a9f5ed" stroke-width="4" stroke-linecap="round"/>
 <circle cx="433" cy="310" r="3" fill="#7cf3d9"/><circle cx="455" cy="310" r="3" fill="#7cf3d9"/><circle cx="477" cy="310" r="3" fill="#7cf3d9"/>
 <text x="455" y="391" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Wi-Fi router</text>
 <text x="455" y="416" text-anchor="middle" fill="#a9c6d9" font-family="Arial,sans-serif" font-size="13">Your home network</text>
</g>
<g>
 <rect x="662" y="220" width="176" height="220" rx="22" fill="url(#card)" stroke="#6ab9ff" stroke-opacity=".8"/>
 <circle cx="750" cy="303" r="42" fill="none" stroke="#a9d5ff" stroke-width="3"/>
 <ellipse cx="750" cy="303" rx="19" ry="42" fill="none" stroke="#a9d5ff" stroke-width="2"/>
 <path d="M710 303h80M719 282h62M719 324h62" stroke="#a9d5ff" stroke-width="2"/>
 <text x="750" y="391" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">ISP & networks</text>
 <text x="750" y="416" text-anchor="middle" fill="#a9c6d9" font-family="Arial,sans-serif" font-size="13">Routes the request</text>
</g>
<g>
 <rect x="942" y="220" width="176" height="220" rx="22" fill="url(#card)" stroke="#9a9bff" stroke-opacity=".8"/>
 <rect x="986" y="268" width="88" height="75" rx="9" fill="none" stroke="#c2c5ff" stroke-width="4"/>
 <path d="M1000 284h60M1000 299h60M1000 314h44" stroke="#c2c5ff" stroke-width="4" stroke-linecap="round"/>
 <circle cx="1001" cy="329" r="3" fill="#73efd8"/>
 <text x="1030" y="391" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Web server</text>
 <text x="1030" y="416" text-anchor="middle" fill="#a9c6d9" font-family="Arial,sans-serif" font-size="13">Website files & data</text>
</g>
<g fill="#a9d8ee" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
 <text x="316" y="230" text-anchor="middle">1 · CONNECT</text><text x="600" y="230" text-anchor="middle">2 · ROUTE</text><text x="894" y="230" text-anchor="middle">3 · REQUEST</text>
</g>
<g fill="#d9f4ff" font-family="Arial,sans-serif" font-size="15">
 <text x="600" y="500" text-anchor="middle" font-weight="700">Then the response travels back</text>
 <text x="600" y="526" text-anchor="middle" fill="#a9c6d9" font-size="13">Your browser uses the returned data to render the page</text>
</g>
<rect x="64" y="555" width="1072" height="1" fill="#7da8c4" opacity=".3"/>
<text x="64" y="580" fill="#86a9bf" font-family="Arial,sans-serif" font-size="12">TEZZ CONNECT · LEARN HOW THE INTERNET WORKS</text>
<text x="1136" y="580" text-anchor="end" fill="#86a9bf" font-family="Arial,sans-serif" font-size="12">Illustrative · Routes can vary</text>
</svg>