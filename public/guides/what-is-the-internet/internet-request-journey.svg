<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">How a website request travels across the internet</title><desc id="desc">A phone connects over Wi-Fi to a home router, then through an internet provider and connected networks to a website server. The server sends page data back to the phone.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10263c"/><stop offset="1" stop-color="#174b63"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#63d8e5"/><stop offset="1" stop-color="#8bbcff"/></linearGradient></defs>
<rect width="960" height="440" rx="26" fill="#f1f7fb"/><rect x="18" y="18" width="924" height="404" rx="20" fill="url(#bg)"/>
<text x="52" y="65" fill="#8ce6ed" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">THE JOURNEY OF A WEB REQUEST</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(76 145)"><rect width="140" height="150" rx="18" fill="#fff" opacity=".09" stroke="#6bdce7"/><rect x="48" y="22" width="44" height="78" rx="8" fill="none" stroke="#9ceaf0" stroke-width="4"/><circle cx="70" cy="88" r="3" fill="#9ceaf0"/><text x="70" y="126" fill="#fff" font-size="17" font-weight="700">Your device</text><text x="70" y="145" fill="#b8d3e2" font-size="11">Phone / laptop</text></g>
<g transform="translate(286 145)"><rect width="140" height="150" rx="18" fill="#fff" opacity=".09" stroke="#6bdce7"/><rect x="34" y="48" width="72" height="40" rx="8" fill="none" stroke="#9ceaf0" stroke-width="4"/><path d="M48 42 Q70 20 92 42 M57 50 Q70 38 83 50" fill="none" stroke="#9ceaf0" stroke-width="3"/><circle cx="52" cy="68" r="3" fill="#9ceaf0"/><circle cx="70" cy="68" r="3" fill="#9ceaf0"/><circle cx="88" cy="68" r="3" fill="#9ceaf0"/><text x="70" y="126" fill="#fff" font-size="17" font-weight="700">Router</text><text x="70" y="145" fill="#b8d3e2" font-size="11">Local network</text></g>
<g transform="translate(496 145)"><rect width="140" height="150" rx="18" fill="#fff" opacity=".09" stroke="#6bdce7"/><circle cx="70" cy="61" r="29" fill="none" stroke="#9ceaf0" stroke-width="3"/><path d="M41 61h58M70 32c-18 18-18 40 0 58M70 32c18 18 18 40 0 58" fill="none" stroke="#9ceaf0" stroke-width="2"/><text x="70" y="126" fill="#fff" font-size="17" font-weight="700">ISP & networks</text><text x="70" y="145" fill="#b8d3e2" font-size="11">Routes the traffic</text></g>
<g transform="translate(706 145)"><rect width="140" height="150" rx="18" fill="#fff" opacity=".09" stroke="#6bdce7"/><rect x="37" y="35" width="66" height="55" rx="7" fill="none" stroke="#9ceaf0" stroke-width="4"/><path d="M48 49h44M48 61h44M48 73h30" stroke="#9ceaf0" stroke-width="3"/><text x="70" y="126" fill="#fff" font-size="17" font-weight="700">Web server</text><text x="70" y="145" fill="#b8d3e2" font-size="11">Website data</text></g>
</g>
<g fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"><path d="M220 220h55m-10 -10 10 10-10 10"/><path d="M430 220h55m-10 -10 10 10-10 10"/><path d="M640 220h55m-10 -10 10 10-10 10"/></g>
<path d="M850 330H110" stroke="#8ce6ed" stroke-width="2" stroke-dasharray="7 8" opacity=".8"/><path d="m120 322-12 8 12 8" fill="none" stroke="#8ce6ed" stroke-width="3"/><text x="480" y="360" fill="#bdebf0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">The server sends page data back — your browser renders the website</text>
<text x="480" y="395" fill="#8daebe" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Simplified illustration · Actual routes and infrastructure can vary</text>
</svg>