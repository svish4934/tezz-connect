<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Choose networking equipment based on your home layout</title><desc id="d">Three home network layouts compare a single router, an extender and a multi-node mesh system.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#123d55"/></linearGradient></defs><rect width="1000" height="470" rx="28" fill="#eaf2f8"/><rect x="12" y="12" width="976" height="446" rx="22" fill="url(#bg)"/><text x="48" y="58" fill="#70e8de" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">TEZZ CONNECT · VISUAL EXPLAINER</text><text x="48" y="105" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="26" font-weight="700">Choose networking equipment based on your home layout</text><g font-family="Arial,sans-serif"><g transform="translate(50 145)"><rect width="280" height="240" rx="18" fill="#153d50" stroke="#4ce0ca"/><text x="140" y="36" fill="#72f0d9" font-size="17" text-anchor="middle" font-weight="700">SINGLE ROUTER</text><rect x="20" y="60" width="240" height="150" rx="10" fill="none" stroke="#7695aa" stroke-width="2"/><circle cx="140" cy="135" r="17" fill="#4ce0ca"/><path d="M140 135L65 85M140 135L220 85M140 135L65 185M140 135L220 185" stroke="#4ce0ca" stroke-dasharray="5 5" stroke-width="3"/><text x="140" y="229" fill="#d5eaf3" text-anchor="middle" font-size="13">One unit for compact spaces</text></g><g transform="translate(360 145)"><rect width="280" height="240" rx="18" fill="#153d50" stroke="#6ab9ff"/><text x="140" y="36" fill="#a9dfff" font-size="17" text-anchor="middle" font-weight="700">EXTENDER</text><rect x="20" y="60" width="240" height="150" rx="10" fill="none" stroke="#7695aa" stroke-width="2"/><circle cx="80" cy="135" r="15" fill="#6ab9ff"/><circle cx="180" cy="135" r="13" fill="#6ab9ff"/><path d="M95 135H165" stroke="#6ab9ff" stroke-width="4" stroke-dasharray="5 5"/><text x="140" y="229" fill="#d5eaf3" text-anchor="middle" font-size="13">Relays signal to a weak area</text></g><g transform="translate(670 145)"><rect width="280" height="240" rx="18" fill="#252f59" stroke="#a49bff"/><text x="140" y="36" fill="#c4b5ff" font-size="17" text-anchor="middle" font-weight="700">MESH SYSTEM</text><rect x="20" y="60" width="240" height="150" rx="10" fill="none" stroke="#7695aa" stroke-width="2"/><g fill="#b5a5ff"><circle cx="65" cy="105" r="12"/><circle cx="210" cy="105" r="12"/><circle cx="140" cy="180" r="12"/></g><path d="M65 105L210 105 140 180 65 105" fill="none" stroke="#b5a5ff" stroke-width="3" stroke-dasharray="5 5"/><text x="140" y="229" fill="#e0e3f5" text-anchor="middle" font-size="13">Coordinated nodes for wider coverage</text></g></g><text x="48" y="430" fill="#8eafc4" font-family="Arial,sans-serif" font-size="12">Illustrative comparison · Actual coverage depends on layout, materials and equipment</text></svg>