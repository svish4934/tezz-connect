<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Choose networking equipment by the problem</title><desc id="d">A decision map connects common home network problems to possible equipment categories, while reminding users to diagnose first.</desc><rect width="1000" height="440" rx="26" fill="#071629"/><text x="42" y="54" fill="#70e8de" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">BUYING DECISION GUIDE</text><text x="42" y="94" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Match the equipment to the problem</text><rect x="350" y="122" width="300" height="62" rx="14" fill="#17475b" stroke="#52e5ce" stroke-width="2"/><text x="500" y="160" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700">What needs fixing?</text><path d="M500 184V210M165 210H835M165 210V235M500 210V235M835 210V235" stroke="#6ab9ff" stroke-width="4" fill="none"/><g font-family="Arial,sans-serif"><rect x="40" y="235" width="250" height="150" rx="16" fill="#12394a" stroke="#52e5ce"/><text x="165" y="273" fill="#70e8de" text-anchor="middle" font-size="19" font-weight="700">Weak coverage</text><text x="165" y="310" fill="#fff" text-anchor="middle" font-size="16">Placement first</text><text x="165" y="338" fill="#c0d5e4" text-anchor="middle" font-size="15">Then consider mesh</text><text x="165" y="362" fill="#c0d5e4" text-anchor="middle" font-size="15">or an extender</text><rect x="375" y="235" width="250" height="150" rx="16" fill="#15334d" stroke="#6ab9ff"/><text x="500" y="273" fill="#9bd0ff" text-anchor="middle" font-size="19" font-weight="700">Need wired ports</text><text x="500" y="310" fill="#fff" text-anchor="middle" font-size="16">Check device ports</text><text x="500" y="338" fill="#c0d5e4" text-anchor="middle" font-size="15">Ethernet cable</text><text x="500" y="362" fill="#c0d5e4" text-anchor="middle" font-size="15">or network switch</text><rect x="710" y="235" width="250" height="150" rx="16" fill="#242d55" stroke="#a49bff"/><text x="835" y="273" fill="#c6c0ff" text-anchor="middle" font-size="19" font-weight="700">Old hardware</text><text x="835" y="310" fill="#fff" text-anchor="middle" font-size="16">Check compatibility</text><text x="835" y="338" fill="#c0d5e4" text-anchor="middle" font-size="15">Security updates</text><text x="835" y="362" fill="#c0d5e4" text-anchor="middle" font-size="15">and port speeds</text></g><text x="500" y="416" fill="#a9c6d9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">A slow ISP connection or congested route may not be fixed by new home equipment</text></svg>