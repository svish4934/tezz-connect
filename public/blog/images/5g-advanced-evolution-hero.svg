ence</text><text x="150" y="158" text-anchor="middle">Efficiency · New use cases</text></g><text x="150" y="187" text-anchor="middle" fill="#a6eee1" font-family="Arial,sans-serif" font-size="13">3GPP Releases 18 and beyond</text></g><g transform="translate(840 255)"><rect width="270" height="90" rx="18" fill="#17445c" stroke="#65b9c5" stroke-width="3"/><rect x="28" y="16" width="40" height="58" rx="7" fill="#267e92" stroke="#a6eee1" stroke-width="3"/><circle cx="48" cy="64" r="3" fill="#fff"/><text x="166" y="52" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20">Phones &amp; wearables</text><rect y="125" width="270" height="90" rx="18" fill="#17445c" stroke="#65b9c5" stroke-width="3"/><path d="M30 175H72M38 160V190M64 160V190" stroke="#a6eee1" stroke-width="4"/><text x="174" y="179" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20">Industry &amp; IoT</text><rect y="250" width="270" height="90" rx="18" fill="#17445c" stroke="#65b9c5" stroke-width="3"/><path d="M40 286Q55 260 70 286Q55 312 40 286Z" fill="#267e92" stroke="#a6eee1" stroke-width="3"/><text x="177" y="302" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20">Satellite &amp; edge</text></g><g stroke="url(#line)" stroke-width="6" fill="none" stroke-linecap="round"><path d="M325 425H430"/><path d="M740 360H825"/><path d="M740 410H825"/><path d="M740 460H825"/></g><text x="68" y="625" fill="#c4e7ed" font-family="Arial,sans-serif" font-size="16">A standards evolution: capabilities depend on network, spectrum, device and operator deployment.</text></svg>