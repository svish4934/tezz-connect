<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">5G network slicing</title><desc id="desc">One shared 5G infrastructure supports three logical service slices for everyday mobile users, industrial automation and critical communications.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#123d60"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17496b"/><stop offset="1" stop-color="#0d2942"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><g fill="#d9f3ff" opacity=".65"><circle cx="100" cy="90" r="3"/><circle cx="330" cy="145" r="2"/><circle cx="910" cy="95" r="3"/><circle cx="1080" cy="210" r="2"/><circle cx="720" cy="55" r="2"/></g><text x="72" y="76" fill="#a9e8ff" font-family="Arial,sans-serif" font-size="19" letter-spacing="4">TEZZ CONNECT · FUTURE INTERNET SERIES</text><text x="72" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="700">ONE 5G NETWORK. MANY SLICES.</text><text x="72" y="171" fill="#b9d8e9" font-family="Arial,sans-serif" font-size="21">Shared infrastructure, tailored logical network environments</text><g transform="translate(600 245)"><rect x="-80" y="-55" width="160" height="110" rx="18" fill="#d8f4ff"/><path d="M-38 -20 L0 -42 L38 -20 M-38 20 L0 -2 L38 20" stroke="#146184" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M0 -2 V36" stroke="#146184" stroke-width="8"/><circle cy="-43" r="7" fill="#146184"/><text x="0" y="85" text-anchor="middle" fill="#d8f4ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">SHARED 5G CORE + RADIO</text></g><path d="M600 335 V370 M600 370 H210 V410 M600 370 V410 M600 370 H990 V410" stroke="#8de1ff" stroke-width="4" fill="none" stroke-linecap="round"/><g><rect x="70" y="410" width="280" height="170" rx="20" fill="url(#panel)" stroke="#63c8ee" stroke-width="3"/><rect x="460" y="410" width="280" height="170" rx="20" fill="url(#panel)" stroke="#82dfb2" stroke-width="3"/><rect x="850" y="410" width="280" height="170" rx="20" fill="url(#panel)" stroke="#f4c879" stroke-width="3"/></g><g fill="#e6f7ff" font-family="Arial,sans-serif" text-anchor="middle"><text x="210" y="455" font-size="21" font-weight="700">SLICE A</text><text x="210" y="490" font-size="19">Everyday broadband</text><text x="210" y="525" font-size="16" opacity=".8">Consumer data and apps</text><text x="600" y="455" font-size="21" font-weight="700">SLICE B</text><text x="600" y="490" font-size="19">Industrial services</text><text x="600" y="525" font-size="16" opacity=".8">Machines, sensors, control</text><text x="990" y="455" font-size="21" font-weight="700">SLICE C</text><text x="990" y="490" font-size="19">Critical communications</text><text x="990" y="525" font-size="16" opacity=".8">Defined priority and policy</text></g><text x="600" y="630" fill="#b6d9ea" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Logical separation does not create unlimited capacity or guarantee identical performance everywhere.</text></svg>