<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">How DNSSEC verifies a DNS answer</title><desc id="desc">A diagram showing a query moving through root, top-level domain and website zones, with signature checks at each step.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#1b3b60"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#5bd5d0"/><stop offset="1" stop-color="#8eb8ff"/></linearGradient></defs><rect width="1200" height="675" rx="34" fill="url(#bg)"/><circle cx="1050" cy="110" r="160" fill="#4d8cc7" opacity=".12"/><circle cx="125" cy="560" r="190" fill="#5bd5d0" opacity=".08"/><text x="72" y="86" fill="#9edbdc" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="3">TEZZ CONNECT · INTERNET EXPLAINED</text><text x="72" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="700">DNSSEC: verify the answer</text><text x="72" y="184" fill="#c5d4e8" font-family="Arial,sans-serif" font-size="22">A cryptographic chain of trust for DNS data</text><g font-family="Arial,sans-serif"><rect x="70" y="250" width="230" height="210" rx="22" fill="#203e61" stroke="#6fcacb" stroke-width="2"/><text x="185" y="300" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">ROOT</text><text x="185" y="339" fill="#c5d4e8" font-size="18" text-anchor="middle">Trust anchor</text><path d="M150 378h70m-35-35v70" stroke="#68d8d2" stroke-width="7" stroke-linecap="round"/><text x="185" y="435" fill="#9edbdc" font-size="16" text-anchor="middle">Signed zone</text><rect x="485" y="250" width="230" height="210" rx="22" fill="#203e61" stroke="#7eaef0" stroke-width="2"/><text x="600" y="300" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">.IN / .COM</text><text x="600" y="339" fill="#c5d4e8" font-size="18" text-anchor="middle">Parent zone</text><path d="M565 378h70m-35-35v70" stroke="#8eb8ff" stroke-width="7" stroke-linecap="round"/><text x="600" y="435" fill="#b7d0ff" font-size="16" text-anchor="middle">DS record</text><rect x="900" y="250" width="230" height="210" rx="22" fill="#203e61" stroke="#6fcacb" stroke-width="2"/><text x="1015" y="300" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">DOMAIN</text><text x="1015" y="339" fill="#c5d4e8" font-size="18" text-anchor="middle">Child zone</text><path d="M980 378h70m-35-35v70" stroke="#68d8d2" stroke-width="7" stroke-linecap="round"/><text x="1015" y="435" fill="#9edbdc" font-size="16" text-anchor="middle">DNSKEY + RRSIG</text><path d="M300 355h185m-16-13 16 13-16 13M715 355h185m-16-13 16 13-16 13" stroke="url(#line)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="500" width="500" height="88" rx="18" fill="#102a47" stroke="#51799e"/><text x="600" y="537" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">VALIDATING RESOLVER</text><text x="600" y="566" fill="#b8cce1" font-size="17" text-anchor="middle">Checks signatures before trusting the answer</text><path d="M600 460v40" stroke="#7eaef0" stroke-width="5" stroke-linecap="round"/><text x="600" y="635" fill="#b8cce1" font-size="17" text-anchor="middle">Authenticity and integrity — not query encryption</text></g></svg>