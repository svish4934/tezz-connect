<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Matter and Thread smart-home connectivity</title><desc id="desc">An original network diagram showing Matter coordinating smart-home devices across Wi-Fi, Ethernet and a Thread mesh through a border router and home controller.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b35"/><stop offset="1" stop-color="#123e62"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45e0d0"/><stop offset="1" stop-color="#5ca9ff"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><circle cx="950" cy="115" r="170" fill="#2bc7c2" opacity=".08"/><circle cx="180" cy="560" r="200" fill="#458dff" opacity=".08"/><text x="70" y="80" fill="#9be8e2" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">TEZZ CONNECT · SMART HOME NETWORKS</text><text x="70" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Matter + Thread</text><text x="70" y="184" fill="#b8d2e7" font-family="Arial,sans-serif" font-size="23">One smart-home language, multiple ways to connect</text><g stroke="#62cfc9" stroke-width="4" fill="none" opacity=".9"><path d="M600 330 L310 255 M600 330 L900 250 M600 330 L300 480 M600 330 L900 480"/><path d="M900 250 L1040 365 L900 480" stroke-dasharray="10 10"/></g><g><rect x="445" y="260" width="310" height="145" rx="24" fill="#123e62" stroke="url(#cyan)" stroke-width="4"/><text x="600" y="315" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">MATTER</text><text x="600" y="352" text-anchor="middle" fill="#b8d2e7" font-family="Arial,sans-serif" font-size="19">Application &amp; interoperability</text></g><g><rect x="105" y="205" width="270" height="100" rx="18" fill="#0d2b49" stroke="#5ca9ff" stroke-width="3"/><text x="240" y="246" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Wi-Fi</text><text x="240" y="277" text-anchor="middle" fill="#b8d2e7" font-family="Arial,sans-serif" font-size="17">Higher-bandwidth devices</text><rect x="825" y="195" width="270" height="110" rx="18" fill="#0d2b49" stroke="#45e0d0" stroke-width="3"/><text x="960" y="239" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Thread mesh</text><text x="960" y="272" text-anchor="middle" fill="#b8d2e7" font-family="Arial,sans-serif" font-size="17">Low-power IPv6 devices</text><rect x="105" y="430" width="270" height="100" rx="18" fill="#0d2b49" stroke="#5ca9ff" stroke-width="3"/><text x="240" y="471" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Ethernet</text><text x="240" y="502" text-anchor="middle" fill="#b8d2e7" font-family="Arial,sans-serif" font-size="17">Wired network link</text><rect x="825" y="430" width="270" height="100" rx="18" fill="#0d2b49" stroke="#45e0d0" stroke-width="3"/><text x="960" y="471" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Border Router</text><text x="960" y="502" text-anchor="middle" fill="#b8d2e7" font-family="Arial,sans-serif" font-size="17">Connects Thread to IP LAN</text></g><g fill="#fff" stroke="#45e0d0" stroke-width="3"><circle cx="880" cy="345" r="22"/><circle cx="1015" cy="365" r="22"/><circle cx="920" cy="405" r="22"/></g><g fill="#071b35" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="880" y="350">L</text><text x="1015" y="370">S</text><text x="920" y="410">P</text></g><text x="600" y="590" text-anchor="middle" fill="#b8d2e7" font-family="Arial,sans-serif" font-size="19">Matter describes how compatible devices communicate · Thread carries IP traffic for low-power devices</text></svg>