<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">IPv4 to IPv6: the internet address transition</title>
<desc id="desc">An original illustration comparing IPv4's 32-bit address space with IPv6's 128-bit address space, with both protocols connecting through a transition network.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10243a"/><stop offset="1" stop-color="#0b5878"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#29b6c8"/><stop offset="1" stop-color="#8ce8df"/></linearGradient></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<g opacity=".12" stroke="#9de8ef"><path d="M0 110H1200M0 220H1200M0 330H1200M0 440H1200M0 550H1200"/><path d="M150 0V675M300 0V675M450 0V675M600 0V675M750 0V675M900 0V675M1050 0V675"/></g>
<text x="78" y="90" fill="#8ce8df" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="4">TEZZ CONNECT · INTERNET EXPLAINED</text>
<text x="78" y="155" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="700">The internet needs</text>
<text x="78" y="210" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="700">more room to connect</text>
<g transform="translate(88 278)">
<rect width="370" height="220" rx="22" fill="#173b57" stroke="#4b7c97" stroke-width="2"/>
<text x="185" y="52" text-anchor="middle" fill="#cfe9f1" font-family="Arial,sans-serif" font-size="20" font-weight="700">IPv4</text>
<text x="185" y="104" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="39" font-weight="700">32 bits</text>
<text x="185" y="144" text-anchor="middle" fill="#9fc5d6" font-family="Arial,sans-serif" font-size="18">About 4.29 billion values</text>
<g transform="translate(75 174)" fill="#45c3d0"><rect width="50" height="15" rx="4"/><rect x="58" width="50" height="15" rx="4"/><rect x="116" width="50" height="15" rx="4"/><rect x="174" width="50" height="15" rx="4"/></g>
</g>
<g transform="translate(742 278)">
<rect width="370" height="220" rx="22" fill="#173b57" stroke="#2cb9c7" stroke-width="2"/>
<text x="185" y="52" text-anchor="middle" fill="#cfe9f1" font-family="Arial,sans-serif" font-size="20" font-weight="700">IPv6</text>
<text x="185" y="104" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="39" font-weight="700">128 bits</text>
<text x="185" y="144" text-anchor="middle" fill="#9fc5d6" font-family="Arial,sans-serif" font-size="18">2¹²⁸ possible values</text>
