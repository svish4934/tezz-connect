<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">How an undersea internet cable is repaired</title><desc id="desc">A cutaway ocean scene showing a repair vessel above a submarine fibre cable, a recovered cable end and a repaired splice on the seabed.</desc><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#d9f1f5"/><stop offset="1" stop-color="#17466f"/></linearGradient><linearGradient id="deep" x2="0" y2="1"><stop stop-color="#1b5b82"/><stop offset="1" stop-color="#092744"/></linearGradient><linearGradient id="hull" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#b8d2df"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="#071c34"/><rect x="28" y="28" width="1144" height="619" rx="22" fill="url(#sea)"/><path d="M28 250 Q150 230 270 252 T520 246 T770 251 T1172 244 V647 H28Z" fill="url(#deep)"/><path d="M28 545 Q180 512 340 550 T650 542 T930 550 T1172 530 V647 H28Z" fill="#0a2e4a"/><g opacity=".25" fill="#fff"><circle cx="120" cy="340" r="4"/><circle cx="175" cy="420" r="3"/><circle cx="1020" cy="360" r="4"/><circle cx="1090" cy="460" r="3"/><circle cx="870" cy="300" r="3"/></g><path d="M390 170 L780 170 L835 228 L345 228Z" fill="url(#hull)" stroke="#164365" stroke-width="5"/><path d="M470 125 H700 V170 H470Z" fill="#f7fbff" stroke="#164365" stroke-width="5"/><path d="M520 95 H665 V125 H520Z" fill="#d4e7ef" stroke="#164365" stroke-width="4"/><path d="M360 228 L820 228 L780 260 L400 260Z" fill="#f0a84b"/><path d="M600 260 V415" stroke="#ffe3a1" stroke-width="5" stroke-dasharray="10 8"/><path d="M600 415 Q550 455 500 470" fill="none" stroke="#ffe3a1" stroke-width="5"/><path d="M80 530 Q250 510 400 540 T700 535 T1120 525" fill="none" stroke="#f4b84b" stroke-width="20" stroke-linecap="round"/><path d="M80 530 Q250 510 400 540 T700 535 T1120 525" fill="none" stroke="#153b58" stroke-width="9" stroke-linecap="round"/><path d="M500 535 L545 516 M550 548 L590 530" stroke="#ffdf8b" stroke-width="8" stroke-linecap="round"/><rect x="528" y="485" width="52" height="48" rx="10" fill="#eaf5f8" stroke="#f5b84b" stroke-width="5"/><path d="M554 485 V463" stroke="#eaf5f8" stroke-width="7"/><g font-family="Arial,sans-serif" fill="#082b48"><rect x="70" y="65" width="300" height="82" rx="16" fill="#f7fbff" opacity=".94"/><text x="94" y="99" font-size="20" font-weight="700">SPECIALIST REPAIR SHIP</text><text x="94" y="127" font-size="16">Locates and lifts the cable</text><path d="M370 108 L450 170" stroke="#082b48" stroke-width="3" fill="none"/><rect x="820" y="65" width="300" height="82" rx="16" fill="#f7fbff" opacity=".94"/><text x="844" y="99" font-size="20" font-weight="700">FIBRE-OPTIC CABLE</text><text x="844" y="127" font-size="16">Carries data as pulses of light</text><path d="M900 147 L950 520" stroke="#082b48" stroke-width="3" fill="none"/><rect x="70" y="565" width="390" height="58" rx="14" fill="#f7fbff" opacity=".94"/><text x="92" y="600" font-size="19" font-weight="700">REPLACEMENT SECTION + SPLICE</text><path d="M460 590 L540 530" stroke="#082b48" stroke-width="3" fill="none"/><rect x="770" y="565" width="350" height="58" rx="14" fill="#f7fbff" opacity=".94"/><text x="792" y="600" font-size="19" font-weight="700">SEABED ROUTE</text></g><text x="70" y="205" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#123a57">ABOVE THE OCEAN FLOOR</text><text x="70" y="300" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f5fb">BELOW THE SURFACE</text><text x="70" y="635" font-family="Arial,sans-serif" font-size="12" fill="#d5eaf4">TEZZ CONNECT · ORIGINAL EDITORIAL ILLUSTRATION</text></svg>