<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three possible futures for the internet</title><desc id="desc">An original conceptual illustration showing 2040 as interconnected mobile and satellite networks, 2075 as ambient computing and connected environments, and 2125 as three possible paths: open global connectivity, fragmented digital regions and resilient low-resource networks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07192d"/><stop offset="1" stop-color="#174a59"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><circle cx="980" cy="90" r="190" fill="#4ac6a9" opacity=".12"/><text x="64" y="70" fill="#a9d7e5" font-family="Arial,sans-serif" font-size="21" letter-spacing="4">TEZZ CONNECT · FUTURE INTERNET SERIES</text><text x="64" y="126" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="700">Three horizons. Many possible futures.</text><g transform="translate(72 205)"><rect width="320" height="330" rx="22" fill="#10354c" stroke="#5fcab7" stroke-width="3"/><text x="160" y="48" fill="#f4cb70" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">2040</text><path d="M55 140h210M160 100v110M95 100l65 40 65-40" stroke="#8ed9e8" stroke-width="5" fill="none"/><circle cx="55" cy="140" r="15" fill="#f4cb70"/><circle cx="265" cy="140" r="15" fill="#f4cb70"/><circle cx="160" cy="100" r="15" fill="#65d8bd"/><circle cx="160" cy="210" r="15" fill="#65d8bd"/><text x="160" y="275" fill="#fff" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Standards in progress</text><text x="160" y="305" fill="#b8d0dc" text-anchor="middle" font-family="Arial" font-size="16">AI · 6G · hybrid networks</text></g><g transform="translate(440 205)"><rect width="320" height="330" rx="22" fill="#10354c" stroke="#5fcab7" stroke-width="3"/><text x="160" y="48" fill="#f4cb70" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">2075</text><circle cx="160" cy="145" r="72" fill="none" stroke="#8ed9e8" stroke-width="5"/><circle cx="160" cy="145" r="35" fill="#1b6270" stroke="#65d8bd" stroke-width="4"/><path d="M160 70v150M85 145h150M105 90l110 110M215 90L105 200" stroke="#65d8bd" stroke-width="3" fill="none"/><text x="160" y="275" fill="#fff" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Conditional possibilities</text><text x="160" y="305" fill="#b8d0dc" text-anchor="middle" font-family="Arial" font-size="16">Ambient · quantum niches · agents</text></g><g transform="translate(808 205)"><rect width="320" height="330" rx="22" fill="#10354c" stroke="#5fcab7" stroke-width="3"/><text x="160" y="48" fill="#f4cb70" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">2125</text><path d="M160 105L75 205h170z" fill="#1b6270" stroke="#8ed9e8" stroke-width="4"/><path d="M160 105v100M75 205h170" stroke="#65d8bd" stroke-width="4"/><circle cx="160" cy="105" r="13" fill="#f4cb70"/><circle cx="75" cy="205" r="13" fill="#65d8bd"/><circle cx="245" cy="205" r="13" fill="#f4cb70"/><text x="160" y="275" fill="#fff" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Multiple scenarios</text><text x="160" y="305" fill="#b8d0dc" text-anchor="middle" font-family="Arial" font-size="16">Open · fragmented · resilient</text></g><rect x="170" y="570" width="860" height="54" rx="17" fill="#0b293f" stroke="#315e73"/><text x="600" y="605" fill="#d8f4ef" text-anchor="middle" font-family="Arial" font-size="21">Evidence for today. Choices for tomorrow. No century-scale certainty.</text></svg>