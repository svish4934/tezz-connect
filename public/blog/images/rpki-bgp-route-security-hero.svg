<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">RPKI checks who may originate an internet route</title><desc id="desc">A route announcement from an autonomous system is compared with a signed Route Origin Authorisation. The result is valid, invalid or not found.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#1b3b60"/></linearGradient><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#61d5c8"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><circle cx="1040" cy="100" r="160" fill="#6ca8d9" opacity=".12"/><circle cx="110" cy="575" r="170" fill="#61d5c8" opacity=".08"/><g font-family="Arial,sans-serif"><text x="70" y="80" fill="#9bded9" font-size="22" font-weight="700" letter-spacing="3">TEZZ CONNECT · INTERNET EXPLAINED</text><text x="70" y="140" fill="#fff" font-size="44" font-weight="700">Who is allowed to announce this route?</text><text x="70" y="180" fill="#c6d5e8" font-size="22">RPKI origin validation compares a BGP announcement with signed authorisation data</text><rect x="70" y="250" width="300" height="205" rx="22" fill="#203f63" stroke="#8fb8ff" stroke-width="2"/><text x="220" y="300" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">BGP UPDATE</text><text x="220" y="345" fill="#c8d8eb" font-size="19" text-anchor="middle">Prefix: 203.0.113.0/24</text><text x="220" y="380" fill="#c8d8eb" font-size="19" text-anchor="middle">Origin: AS64500</text><text x="220" y="420" fill="#9fc0ed" font-size="16" text-anchor="middle">Route announcement</text><rect x="450" y="250" width="300" height="205" rx="22" fill="#203f63" stroke="#63d4c9" stroke-width="2"/><text x="600" y="300" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">VALIDATED ROA</text><text x="600" y="345" fill="#c8d8eb" font-size="19" text-anchor="middle">Prefix: 203.0.113.0/24</text><text x="600" y="380" fill="#c8d8eb" font-size="19" text-anchor="middle">Origin: AS64500</text><text x="600" y="420" fill="#9bded9" font-size="16" text-anchor="middle">Signed authorisation</text><path d="M370 350h80m-16-13 16 13-16 13M750 350h80m-16-13 16 13-16 13" stroke="url(#flow)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="830" y="250" width="300" height="205" rx="22" fill="#183b4c" stroke="#61d5c8" stroke-width="2"/><text x="980" y="300" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">ROV RESULT</text><rect x="880" y="330" width="200" height="58" rx="14" fill="#205d58"/><text x="980" y="368" fill="#d7fff8" font-size="24" font-weight="700" text-anchor="middle">VALID</text><text x="980" y="420" fill="#c6d5e8" font-size="16" text-anchor="middle">Origin is authorised</text><rect x="165" y="510" width="870" height="92" rx="18" fill="#102a47" stroke="#51799e"/><text x="600" y="548" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">THREE POSSIBLE STATES</text><text x="600" y="579" fill="#b9cde2" font-size="19" text-anchor="middle">VALID · INVALID · NOT FOUND — policy remains with each network</text><text x="600" y="640" fill="#b9cde2" font-size="17" text-anchor="middle">RPKI checks the origin ASN, not every hop in the route</text></g></svg>